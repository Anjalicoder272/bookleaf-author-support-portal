[project]
name = "bookleaf-backend"
version = "0.1.0"
description = "BookLeaf Author Support Portal API (Django REST Framework)"
authors = [{ name = "Anjali Sharma", email = "anjalisharma.coder@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "google-genai>=2.31.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false
