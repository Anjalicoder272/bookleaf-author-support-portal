# Render Blueprint for the Django API. The Next.js frontend deploys separately on Vercel.
services:
  - type: web
    name: bookleaf-author-support-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: uv run gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL # Neon Postgres connection string
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CORS_ALLOWED_ORIGINS # the Vercel frontend
        value: https://bookleaf-author-support-beta.vercel.app
      - key: DEMO_AUTHOR_PASSWORD
        value: author123
      - key: DEMO_ADMIN_PASSWORD
        value: admin123
